server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API проксируем БЕЗ обрезки префикса /api: все маршруты бэкенда
    # начинаются с /api, и nginx обязан передать префикс как есть.
    # Со слэшем на конце proxy_pass префикс срезался бы, и бэкенд получил
    # бы /orders вместо /api/orders.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Приложение однопстраничное и не использует роутер: адреса вида
    # /dashboard не существует, всё переключение внутри index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}