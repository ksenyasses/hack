# Статичное превью интерфейса на GitHub Pages.
#
# Зачем: во время презентации жюри может открыть ссылку и смотреть
# интерфейс на своём телефоне или ноутбуке, пока ты ведёшь живое демо.
#
# Что это НЕ: не демонстрация системы. Бэкент на Pages не запускается,
# поэтому страница собрана в режиме заглушек (VITE_USE_MOCK=true) —
# интерфейс настоящий, данные условные. Настоящая система запускается
# локально по README.
#
# Запускается вручную: вкладка Actions → Publish interface preview → Run.

name: Publish interface preview

on:
  # Только по кнопке. Каждый пуш в main не должен зря гонять сборку.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        working-directory: frontend
        run: npm ci

      - name: Собрать фронтент
        working-directory: frontend
        env:
          # Страница живёт по подпути /hack/
          VITE_BASE: /hack/
          # Бэкенда на Pages нет, поэтому страница работает на заглушках
          VITE_USE_MOCK: 'true'
        run: npm run build

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Выложить
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4